name: Build and deploy main

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: true

      - name: Build root project
        run: pnpm run build

      - name: Build examples
        run: |
          cd examples
          pnpm install
          pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./examples/dist

      - name: Typecheck src and tests
        run: |
          pnpm run typecheck
          pnpm run typecheck:tst

      # The examples build with vite, which transpiles without typechecking, so they need their own pass.
      - name: Typecheck examples against dist
        run: pnpm run typecheck:examples

      - name: Run tests
        run: pnpm test

      # A real ANGLE/SwiftShader driver, which is the only thing that proves the emitted GLSL links.
      - name: Install Chromium for the GLSL gate
        run: pnpm exec playwright install --with-deps chromium

      - name: Compile and link emitted GLSL
        run: pnpm run test:glsl

      - name: One-backend bundles shake the other out
        run: pnpm run test:shake

      # Fails on a module the reference cannot resolve, which is how the frame API went undocumented.
      - name: Docs build
        run: pnpm run docs

      - name: Install naga-cli
        run: cargo install naga-cli

      - name: Validate emitted WGSL with naga (Firefox's validator)
        run: pnpm run test:wgsl

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
